TARGET_URL: "https://i.chaoxing.com"

WAIT_SECONDS: 5

CLICK_POINTS: []

CHROME_CANDIDATE_PATHS:
  - "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
  - "C:\\Program Files (x86)\\Google\\Chrome\\Application\\chrome.exe"
  - "C:\\Users\\${USERNAME}\\AppData\\Local\\Google\\Chrome\\Application\\chrome.exe"

CHROME_ARGS:
  - "--window-size=1920,1080"
  - "--window-position=0,0"

CATALOG_ROI: [0.72, 0.24, 1.00, 1.00]

TITLE_ROI: [0.05, 0.15, 0.40, 0.32]

VIDEO_CENTER: [0.40, 0.68]

VIDEO_ROI: [0.02, 0.28, 0.72, 0.86]

# 启动视频播放的方式:
#   "space" = 向视频界面发送按键(默认空格)开始播放, 需要 Chrome 窗口处于焦点
#   "click" = 用边缘模板匹配定位播放键并点击
PLAY_METHOD: "space"

# 当 PLAY_METHOD 为 "space" 时发送的按键名称(pyautogui 键名, 如 space/enter)
PLAY_KEY: "space"

# PLAY_METHOD 为 "space" 时, 按空格前是否先点击视频界面使其获得焦点
# (部分平台需先点击视频区域, 空格键才会生效)
PLAY_FOCUS_CLICK: true

# PLAY_METHOD 为 "space" 时, 点击视频界面后等待多少秒再按空格(秒)
PLAY_FOCUS_DELAY: 1

MAX_PLAY_RETRY: 6

VERIFY_PLAYBACK: false

PLAY_VERIFY_DELAY: 12

COMPLETION_KEYWORDS: ["任务完成", "任务点已完成", "已完成"]

COURSE_TIMEOUT: 1800

POLL_INTERVAL: 5

SCROLL_STEPS: -400

SCROLL_UP: 400

MAX_ROLLS: 12

play_button_template: "assets/play_button.png"

mission_complete_template: "assets/mission_complete.png"

mission_incomplete_template: "assets/mission_incomplete.png"

MISSION_MATCH_THRESHOLD: 0.8

MATCH_THRESHOLD: 0.75

EDGE_MATCH_THRESHOLD: 0.5

CANNY_LOW: 50

CANNY_HIGH: 150

MATCH_SCALE_MIN: 0.5

MATCH_SCALE_MAX: 2.0

MATCH_SCALE_STEP: 0.05
